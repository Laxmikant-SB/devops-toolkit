name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show repository contents
        run: ls -la

      - name: Check all shell scripts exist
        run: |
          echo "Checking monitoring scripts..."
          ls scripts/monitoring/
          echo "Checking backup scripts..."
          ls scripts/backup/
          echo "Checking security scripts..."
          ls scripts/security/
          echo "All scripts found!"

      - name: Verify scripts are executable
        run: |
          for script in $(find scripts/ -name "*.sh"); do
            if [ -x "$script" ]; then
              echo "✅ Executable: $script"
            else
              echo "❌ NOT executable: $script"
              exit 1
            fi
          done

      - name: Run health check script
        run: |
          chmod +x scripts/monitoring/health_check.sh
          bash scripts/monitoring/health_check.sh || true

      - name: Validate config file
        run: |
          echo "Checking config file..."
          source config/settings.cfg
          echo "DISK_WARNING=$DISK_WARNING"
          echo "MEM_WARNING=$MEM_WARNING"
          echo "Config is valid!"
