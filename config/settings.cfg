# ── DevOps Toolkit Global Config ──────────────

# Alert thresholds
DISK_WARNING=70
DISK_CRITICAL=85
MEM_WARNING=60
MEM_CRITICAL=80
CPU_WARNING=70
CPU_CRITICAL=90

# Backup config
BACKUP_DIR="/tmp/backups"
KEEP_BACKUPS=7

# Notification (fill in real values when deploying)
ALERT_EMAIL="admin@company.com"

# Environment
ENVIRONMENT="development"
